volumes:
  pg_data_production:
  static_volume:
  media_volume:

services:
  db:
    container_name: rental_db
    image: postgres:14
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data
  backend:
    container_name: rental_backend
    image: elenapetrovadocker/rental_backend
    env_file: .env
    volumes: 
      - static_volume:/backend_static
      - media_volume:/app/media
    depends_on:
      - db
  frontend:
    container_name: rental_frontend
    image: elenapetrovadocker/rental_frontend
    env_file: .env
    command: cp -r /app/build/. /static/
    volumes:
      - static_volume:/static
  gateway:
    container_name: rental_gateway
    image: elenapetrovadocker/rental_gateway
    env_file: .env
    ports:
      - 8010:80
    volumes:
      - static_volume:/static
      - media_volume:/app/media
    depends_on:
      - backend
      - frontend
