volumes:
  pg_data:
  static_volume:
  media_volume:

services:
  db:
    container_name: rental_db
    image: postgres:14
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    container_name: rental_backend
    build: ./backend/
    env_file: .env
    volumes:
      - static_volume:/backend_static
      - media_volume:/app/media/
    depends_on:
      - db
  frontend:
    container_name: rental_frontend
    env_file: .env
    build: ./frontend_stub/
    command: cp -r /app/build/. /static/
    volumes:
      - static_volume:/static
  gateway:
    container_name: rental_gateway
    build: ./nginx/
    env_file: .env
    ports:
      - 8000:80
    volumes:
      - static_volume:/static
      - media_volume:/app/media/
    #   - ./docs:/usr/share/nginx/html/api/docs/
    depends_on:
      - backend
      - frontend