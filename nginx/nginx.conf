server {
    listen 80;
    index index.html;

    server_tokens off;

    client_max_body_size 20M;

    location /static/ {
        alias /backend_static/static/;
    }

    location /api/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/api/;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/admin/;
    }

    location /media/ {
        alias /app/media/;
    }

    location /s/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000;
    }

    location / {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000;
    }
}
